syntax = "proto3";

package vitals;

option java_multiple_files = true;
option java_package = "com.vanguard.vitals";

service VitalsService {
  rpc GetVitals (GetVitalsRequest) returns (GetVitalsResponse);
  rpc RecordVitals (RecordVitalsRequest) returns (RecordVitalsResponse);
}

message GetVitalsRequest {
  string patient_id = 1;
}

message GetVitalsResponse {
  string patient_id = 1;
  float heart_rate = 2;
  float blood_pressure_systolic = 3;
  float blood_pressure_diastolic = 4;
  float temperature = 5;
  float oxygen_saturation = 6;
  string created_at = 7;
}

message RecordVitalsRequest {
  string patient_id = 1;
  float heart_rate = 2;
  float blood_pressure_systolic = 3;
  float blood_pressure_diastolic = 4;
  float temperature = 5;
  float oxygen_saturation = 6;
}

message RecordVitalsResponse {
  bool success = 1;
  string message = 2;
  string created_at = 3;
}
